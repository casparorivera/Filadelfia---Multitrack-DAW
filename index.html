<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filadelfia — Reproductor de Secuencias</title>
<style>
:root{--bg:#090b0d;--p:#13171a;--p2:#1b2024;--line:#3b4247;--gold:#d6aa3b;--gold2:#f1d477;--txt:#eee;--muted:#929aa0;--blue:#54c5ff;--green:#54df83;--red:#ff5555}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#20262b,#090b0d 52%,#050607);color:var(--txt);font-family:Arial,sans-serif}.app{max-width:1500px;margin:auto;padding:14px}
header{height:62px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #292f34}.logo{font-family:Georgia,serif;color:var(--gold2);font-size:25px;letter-spacing:2px}.sub{font-size:10px;color:var(--gold);letter-spacing:2px}.status{margin-left:auto;color:var(--muted);font-size:11px}
.transport{margin-top:12px;padding:10px;display:flex;align-items:center;gap:9px;background:linear-gradient(#20262b,#0e1113);border:1px solid var(--line);border-radius:11px}.btn{background:linear-gradient(#30373c,#15191c);color:#eee;border:1px solid #515960;border-radius:6px;padding:9px 14px;cursor:pointer}.btn:hover{border-color:var(--gold)}.btn.active{color:var(--gold2);border-color:var(--gold)}.time{font:20px monospace;color:var(--blue);white-space:nowrap}.progress{flex:1}.progress input{width:100%;accent-color:var(--gold)}.master{display:flex;align-items:center;gap:7px;font-size:9px;color:#999}.master input{width:120px;accent-color:var(--gold)}
.layout{display:grid;grid-template-columns:270px 1fr;gap:12px;margin-top:12px}.panel{background:linear-gradient(145deg,#171b1e,#0b0e10);border:1px solid var(--line);border-radius:10px;overflow:hidden}.head{padding:13px 15px;border-bottom:1px solid #30363a;color:var(--gold2);font-weight:bold}.list{padding:10px;min-height:520px}.seq{display:block;width:100%;text-align:left;padding:13px;margin-bottom:8px;background:linear-gradient(#272b2e,#15181a);border:1px solid #555;color:#eee;border-radius:8px;cursor:pointer}.seq:hover,.seq.selected{border-color:var(--gold);box-shadow:inset 0 0 20px #d6aa3b16}.seq .name{font-weight:bold;font-size:13px}.seq .folder{font-size:10px;color:var(--muted);margin-top:5px}.foot{border-top:1px solid #30363a;padding:11px;text-align:center;color:#70777c;font-size:10px}
.mixerHead{display:flex;align-items:center}.count{margin-left:auto;color:var(--muted);font-size:11px}.channels{display:flex;gap:7px;padding:9px;overflow-x:auto;min-height:570px}.channel{flex:0 0 104px;background:linear-gradient(90deg,#101315,#1d2225,#101315);border:1px solid #41484d;border-radius:7px;padding:7px;box-shadow:inset 0 0 20px #000a}.no{text-align:center;color:#888;font-size:10px}.name{text-align:center;font-weight:bold;font-size:11px;height:32px;display:flex;align-items:center;justify-content:center;overflow:hidden}.panlabel{text-align:center;font-size:9px;color:#777}.pan{display:block;width:58px;height:45px;margin:2px auto 5px;accent-color:var(--gold)}.smrow{display:flex;gap:5px;justify-content:center}.sm{flex:1;background:#15181a;border:1px solid #555;color:#ddd;border-radius:4px;padding:6px 0;font-size:10px;cursor:pointer}.sm.son{color:var(--gold2);border-color:var(--gold);background:#342b12}.sm.mon{color:#ff8585;border-color:#9d3d3d;background:#321718}.meterfader{height:310px;display:grid;grid-template-columns:24px 1fr;gap:7px;margin-top:8px}.meter{background:#050606;border:1px solid #292e31;border-radius:3px;display:flex;flex-direction:column-reverse;gap:1px;padding:2px}.seg{height:5px;background:#1e2427}.seg.on{background:var(--green)}.seg.hot{background:#e8c83c}.seg.clip{background:var(--red)}.fader{width:100%;height:100%;accent-color:var(--gold);writing-mode:vertical-lr;direction:rtl}.db{text-align:center;color:var(--blue);font:10px monospace;background:#07090a;border:1px solid #282d30;padding:5px;margin-top:5px}.bottom{margin-top:12px;padding:10px;background:linear-gradient(#181d20,#0c0f11);border:1px solid var(--line);border-radius:9px;display:flex;gap:8px;align-items:center}.notice{display:none;margin:9px;padding:9px;border:1px solid #5d4a20;background:#1c170b;color:#e0c987;border-radius:6px;font-size:11px}.empty{padding:45px;text-align:center;color:#929aa0}
@media(max-width:850px){.layout{grid-template-columns:1fr}.status{display:none}.list{min-height:auto}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="logo">♬ FILADELFIA</div><div class="sub">MINISTERIO DE ALABANZA</div></div><div class="status" id="status">Conectando…</div></header>

<div class="transport">
<button class="btn" id="stop">■</button><button class="btn" id="play">▶</button><button class="btn" id="pause">Ⅱ</button>
<div class="time" id="time">00:00 / 00:00</div><div class="progress"><input id="seek" type="range" min="0" max="1" value="0" step=".01"></div>
<div class="master">MASTER <input id="master" type="range" min="0" max="1" value=".9" step=".01"></div>
</div>

<div class="layout">
<aside class="panel"><div class="head">📁 SECUENCIAS DISPONIBLES</div><div class="list" id="list"><div class="empty">Cargando…</div></div><div class="foot">Reproductor multipista · Filadelfia</div></aside>
<main class="panel"><div class="head mixerHead"><span id="title">Seleccione una secuencia</span><span class="count" id="count"></span></div><div class="notice" id="notice"></div><div class="channels" id="channels"><div class="empty">Seleccione una secuencia.</div></div></main>
</div>
<div class="bottom"><button class="btn" id="back">|◀ 10s</button><button class="btn" id="loop">↻ LOOP</button><button class="btn" id="next">10s ▶|</button><span style="color:#777;font-size:10px">Audio HTML5 + Web Audio · controles independientes por pista</span></div>
</div>

<script>
const BASE="https://f005.backblazeb2.com/file/daw-filadelfia-audios/Secuencias/";
let tracks=[],duration=0,playing=false,position=0,lastStart=0,raf=null,loop=false,masterGain=null,ctx=null;

const $=x=>document.getElementById(x);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fileURL(folder,file){return BASE+folder.split("/").map(encodeURIComponent).join("/")+"/"+file.split("/").map(encodeURIComponent).join("/")}
function fmt(x){x=Math.max(0,x||0);return String(Math.floor(x/60)).padStart(2,"0")+":"+String(Math.floor(x%60)).padStart(2,"0")}
async function json(u){let r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
async function audioInit(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();masterGain=ctx.createGain();masterGain.gain.value=+$("master").value;masterGain.connect(ctx.destination)}
function parse(f){let b=f.split("/").pop(),m=b.match(/^pista-(\d+)-(.+?)\.(mp3|wav|ogg|m4a)$/i);return m?{number:+m[1],name:m[2],file:f}:null}

async function loadSequences(){
 try{let d=await json(BASE+"index-secuencia.json"),a=d.sequences||[];$("list").innerHTML="";
  if(!a.length){$("list").innerHTML='<div class="empty">No hay secuencias.</div>';return}
  a.forEach(s=>{let b=document.createElement("button");b.className="seq";b.innerHTML='<div class="name">♫ '+esc(s.name)+'</div><div class="folder">'+esc(s.folder)+'</div>';b.onclick=()=>loadSequence(s,b);$("list").appendChild(b)});
  $("status").textContent=a.length+" secuencia"+(a.length==1?"":"s")+" disponible"+(a.length==1?"":"s");
 }catch(e){console.error(e);$("list").innerHTML='<div class="empty">No se pudo leer index-secuencia.json.</div>';$("status").textContent="Error de índice"}
}

async function loadSequence(s,b){
 stopAll();document.querySelectorAll(".seq").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("title").textContent="Secuencia: "+s.name;$("count").textContent="";hide();
 try{
  let d=await json(fileURL(s.folder,"index-pista.json"));
  let a=(d.tracks||[]).map(parse).filter(Boolean).sort((x,y)=>x.number-y.number);
  if(!a.length)throw Error("index-pista.json no contiene pistas válidas");
  tracks=a.map(t=>({...t,el:null,source:null,gain:null,panNode:null,volume:1,pan:0,muted:false,solo:false,level:0}));
  $("count").textContent=tracks.length+" pistas";render();await audioInit();
  $("status").textContent="Preparando "+tracks.length+" pistas…";
  // Cada pista usa un <audio> HTML5, evitando fetch/decodeAudioData del MP3.
  await Promise.all(tracks.map((t,i)=>new Promise(resolve=>{
    const el=new Audio();el.preload="metadata";el.src=fileURL(s.folder,t.file);el.crossOrigin="anonymous";
    el.addEventListener("loadedmetadata",()=>{t.el=el;duration=Math.max(duration||0,el.duration||0);resolve()}, {once:true});
    el.addEventListener("error",()=>{t.error=true;resolve()},{once:true});
  })));
  $("seek").max=duration;$("time").textContent=fmt(0)+" / "+fmt(duration);
  let bad=tracks.filter(t=>t.error);
  $("status").textContent=(bad.length?"Carga parcial":"Listo")+": "+s.name;
  if(bad.length)show("No se pudieron cargar: "+bad.map(t=>t.file).join(", "));
  connectAudio();startMeters();
 }catch(e){console.error(e);$("channels").innerHTML='<div class="empty">No fue posible cargar la secuencia.</div>';show("Error: "+e.message);$("status").textContent="Error al cargar"}
}
function render(){
 $("channels").innerHTML="";
 tracks.forEach((t,i)=>{let c=document.createElement("div");c.className="channel";c.innerHTML=
 `<div class="no">${t.number}</div><div class="name" title="${esc(t.name)}">${esc(t.name)}</div>
 <div class="panlabel">PAN</div><input class="pan" type="range" min="-1" max="1" step=".01" value="0">
 <div class="smrow"><button class="sm solo">S</button><button class="sm mute">M</button></div>
 <div class="meterfader"><div class="meter">${'<i class="seg"></i>'.repeat(30)}</div><input class="fader" type="range" min="0" max="1" value="1" step=".01"></div>
 <div class="db">0.0 dB</div><button class="sm muteBottom">MUTE</button>`;
 let pan=c.querySelector(".pan"),f=c.querySelector(".fader"),s=c.querySelector(".solo"),m=c.querySelector(".mute"),mb=c.querySelector(".muteBottom");
 pan.oninput=e=>{t.pan=+e.target.value;if(t.panNode)t.panNode.pan.value=t.pan};
 f.oninput=e=>{t.volume=+e.target.value;c.querySelector(".db").textContent=t.volume?" "+(20*Math.log10(t.volume)).toFixed(1)+" dB":" -∞";applyGains()};
 const tog=()=>{t.muted=!t.muted;m.classList.toggle("mon",t.muted);mb.classList.toggle("mon",t.muted);applyGains()};m.onclick=tog;mb.onclick=tog;
 s.onclick=()=>{t.solo=!t.solo;s.classList.toggle("son",t.solo);applyGains()};$("channels").appendChild(c)
 })
}
function connectAudio(){
 tracks.forEach(t=>{if(!t.el)return;try{t.source?.disconnect()}catch{};try{t.source=ctx.createMediaElementSource(t.el)}catch(e){console.warn(e);return}
 t.gain=ctx.createGain();t.panNode=ctx.createStereoPanner();t.source.connect(t.gain).connect(t.panNode).connect(masterGain);t.el.onended=()=>{if(playing&&current()>=duration-.1){if(loop)playFrom(0);else{playing=false;position=duration;ui()}}};applyGains()})
}
function applyGains(){let any=tracks.some(t=>t.solo);tracks.forEach(t=>{if(t.gain)t.gain.gain.value=(t.muted||(any&&!t.solo))?0:t.volume;if(t.panNode)t.panNode.pan.value=t.pan})}
function current(){return playing?Math.min(duration,(performance.now()/1000-lastStart)):position}
async function playFrom(p){if(!tracks.length)return;await audioInit();await ctx.resume();p=Math.max(0,Math.min(duration,p));tracks.forEach(t=>{if(t.el){t.el.currentTime=p;t.el.play().catch(()=>{})}});position=p;lastStart=performance.now()/1000-p;playing=true;ui();tick()}
function pause(){if(!playing)return;position=current();tracks.forEach(t=>t.el?.pause());playing=false;cancelAnimationFrame(raf);ui()}
function stopAll(){playing=false;position=0;tracks.forEach(t=>{if(t.el){t.el.pause();try{t.el.currentTime=0}catch{}}});cancelAnimationFrame(raf);ui()}
function ui(){let p=current();$("seek").value=p;$("time").textContent=fmt(p)+" / "+fmt(duration);$("play").classList.toggle("active",playing)}
function tick(){ui();if(playing)raf=requestAnimationFrame(tick)}
function startMeters(){if(!ctx)return;const loopM=()=>{document.querySelectorAll(".channel").forEach((c,i)=>{let t=tracks[i];let level=t?.el&&!t.el.paused?Math.min(1,Math.random()*.65+.18):0;c.querySelectorAll(".seg").forEach((s,n)=>{s.classList.toggle("on",n<level*30);s.classList.toggle("hot",n>24&&n<level*30);s.classList.toggle("clip",n>28&&n<level*30)})});requestAnimationFrame(loopM)};loopM()}
$("play").onclick=()=>playing?pause():playFrom(current());$("pause").onclick=pause;$("stop").onclick=stopAll;
$("seek").oninput=e=>{position=+e.target.value;if(playing)playFrom(position);else ui()};
$("master").oninput=e=>{if(masterGain)masterGain.gain.value=+e.target.value};
$("loop").onclick=()=>{loop=!loop;$("loop").classList.toggle("active",loop)};
$("back").onclick=()=>playFrom(Math.max(0,current()-10));$("next").onclick=()=>playFrom(Math.min(duration,current()+10));
function show(x){$("notice").textContent=x;$("notice").style.display="block"}function hide(){$("notice").style.display="none"}
loadSequences();
</script>
</body>
</html>
