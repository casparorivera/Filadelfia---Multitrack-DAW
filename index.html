<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filadelfia — Reproductor de Secuencias</title>
<style>
:root{
  --bg:#090b0d; --panel:#121518; --panel2:#171b1f; --line:#343a40;
  --gold:#d6a93a; --gold2:#f0cf70; --text:#f1f1ee; --muted:#9da3a8;
  --green:#57e389; --red:#ff4d4d; --blue:#48b8ff;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#1b2024 0,#090b0d 48%,#060708 100%);
color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button,input{font:inherit}
.app{max-width:1500px;margin:auto;padding:18px}
header{display:flex;align-items:center;gap:18px;padding:8px 4px 16px;border-bottom:1px solid #2a2f33}
.logoMark{width:52px;height:52px;border:1px solid #80621e;border-radius:12px;display:grid;place-items:center;color:var(--gold2);font-size:27px;box-shadow:inset 0 0 18px #000}
.brand h1{margin:0;font-family:Georgia,serif;letter-spacing:2px;font-size:25px;color:#eee}
.brand p{margin:3px 0 0;color:var(--gold2);font-size:11px;letter-spacing:2px}
.status{margin-left:auto;color:var(--muted);font-size:12px}
.transport{margin-top:14px;background:linear-gradient(#1b2024,#0e1114);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 35px #0008}
.btn{border:1px solid #4b5258;background:linear-gradient(#30363b,#15191c);color:#eee;border-radius:7px;padding:10px 15px;cursor:pointer;box-shadow:inset 0 1px #ffffff22}
.btn:hover{border-color:#8b702b}.btn.active{border-color:var(--gold);color:var(--gold2)}
.btn.play{font-size:19px;padding:8px 19px}.btn.stop{color:#ff7777}
.time{font-variant-numeric:tabular-nums;font-family:monospace;font-size:20px;color:var(--blue);min-width:115px;text-align:center}
.master{margin-left:auto;display:flex;align-items:center;gap:10px}.master input{width:130px}
input[type=range]{accent-color:var(--gold);cursor:pointer}
.layout{display:grid;grid-template-columns:270px 1fr;gap:14px;margin-top:14px}
.sidebar,.mixerWrap{background:linear-gradient(145deg,#161a1d,#0c0f11);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sideHead,.mixerHead{padding:14px 16px;border-bottom:1px solid #30353a;color:var(--gold2);font-weight:bold}
.sequenceList{padding:10px;min-height:530px}
.sequence{width:100%;text-align:left;background:linear-gradient(#25282a,#16191b);border:1px solid #4a4a42;color:#eee;border-radius:9px;padding:14px;cursor:pointer;margin-bottom:9px}
.sequence:hover,.sequence.selected{border-color:var(--gold);box-shadow:0 0 0 1px #d6a93a33,inset 0 0 22px #d6a93a14}
.sequence .name{font-weight:bold;font-size:14px}.sequence .meta{color:var(--muted);font-size:11px;margin-top:6px}
.sideFoot{padding:12px 14px;border-top:1px solid #30353a;color:#73797d;font-size:10px;text-align:center}
.mixerHead{display:flex;align-items:center;gap:12px}.mixerHead .title{font-size:17px}.mixerHead .count{margin-left:auto;color:var(--muted);font-size:12px}
.channels{display:flex;gap:7px;padding:10px;overflow-x:auto;min-height:590px}
.channel{flex:0 0 106px;background:linear-gradient(90deg,#111416,#1b1f22 50%,#101214);border:1px solid #3b4145;border-radius:7px;padding:8px 7px;position:relative;box-shadow:inset 0 0 18px #0008}
.chNo{text-align:center;color:#888;font-size:10px}.chName{text-align:center;font-weight:bold;font-size:12px;height:32px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.panLabel{text-align:center;color:#777;font-size:9px;margin-top:2px}
.pan{width:55px;height:55px;border-radius:50%;display:block;margin:4px auto 7px;accent-color:var(--gold)}
.soloMute{display:flex;justify-content:center;gap:5px}.sm{width:40px;padding:7px 0;border:1px solid #555;background:#15181a;color:#ddd;border-radius:5px;cursor:pointer;font-size:10px}.sm.soloOn{color:var(--gold2);border-color:var(--gold);background:#332b16}.sm.muteOn{color:#ff7c7c;border-color:#9c3939;background:#321719}
.meterFader{display:grid;grid-template-columns:25px 1fr;gap:7px;height:320px;margin-top:9px}
.meter{position:relative;border:1px solid #252a2e;background:#050607;border-radius:3px;overflow:hidden;display:flex;flex-direction:column-reverse;padding:2px;gap:1px}
.seg{height:5px;min-height:5px;background:#222;border-radius:1px}.seg.on{background:var(--green)}.seg.hot{background:#e6c83e}.seg.clip{background:#ff4b4b}
.faderBox{position:relative;height:100%}.fader{-webkit-appearance:none;appearance:none;writing-mode:vertical-lr;direction:rtl;width:100%;height:100%;background:transparent}
.fader::-webkit-slider-runnable-track{width:4px;background:linear-gradient(#555,#222);border-radius:3px}.fader::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:42px;border-radius:3px;background:linear-gradient(#eee,#888);border:1px solid #444;box-shadow:0 2px 5px #000}
.fader::-moz-range-track{width:4px;background:#333}.fader::-moz-range-thumb{width:18px;height:42px;border-radius:3px;background:#ddd;border:1px solid #444}
.db{text-align:center;background:#07090a;border:1px solid #272b2f;border-radius:4px;color:var(--blue);font:11px monospace;padding:5px;margin-top:6px}
.muteBottom{width:100%;margin-top:7px}
.bottom{margin-top:12px;background:linear-gradient(#171b1e,#0d1012);border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.progress{flex:1;min-width:220px}.progress input{width:100%}
.empty{padding:40px;text-align:center;color:var(--muted)}
.notice{margin-top:10px;padding:10px 12px;border:1px solid #5b4920;background:#1c170c;color:#d7c28a;border-radius:7px;font-size:12px;display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sequenceList{min-height:auto}.status{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logoMark">♬</div>
  <div class="brand"><h1>FILADELFIA</h1><p>MINISTERIO DE ALABANZA</p></div>
  <div class="status" id="status">Esperando secuencias…</div>
</header>

<section class="transport">
  <button class="btn stop" id="stopBtn">■</button>
  <button class="btn play" id="playBtn">▶</button>
  <button class="btn" id="pauseBtn">Ⅱ</button>
  <div class="time" id="time">00:00 / 00:00</div>
  <div class="progress"><input id="seek" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="master"><span style="font-size:10px;color:#999">MASTER</span><input id="master" type="range" min="0" max="1" step="0.01" value="0.9"></div>
</section>

<div class="layout">
  <aside class="sidebar">
    <div class="sideHead">📁 SECUENCIAS DISPONIBLES</div>
    <div class="sequenceList" id="sequenceList"><div class="empty">Cargando…</div></div>
    <div class="sideFoot">Reproductor multipista · Filadelfia</div>
  </aside>

  <main class="mixerWrap">
    <div class="mixerHead">
      <span class="title" id="sequenceTitle">Seleccione una secuencia</span>
      <span class="count" id="trackCount"></span>
    </div>
    <div id="notice" class="notice"></div>
    <div class="channels" id="channels"><div class="empty">Seleccione una secuencia de la izquierda.</div></div>
  </main>
</div>

<div class="bottom">
  <button class="btn" id="rewindBtn">|◀</button>
  <button class="btn" id="loopBtn">↻ LOOP</button>
  <button class="btn" id="forwardBtn">▶|</button>
  <span style="color:#888;font-size:11px">Los canales se crean automáticamente a partir de index-pista.json</span>
</div>
</div>

<script>
const BASE_URL = "https://f005.backblazeb2.com/file/daw-filadelfia-audios/Secuencias/";
const SEQUENCE_INDEX = "index-secuencia.json";
let audioCtx = null, masterGain = null, analyser = null;
let tracks = [], isPlaying = false, startedAt = 0, pausedAt = 0, raf = null, duration = 0, loop = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url = (folder, file) => BASE_URL + encodeURIComponent(folder) + "/" + file.split("/").map(encodeURIComponent).join("/");

function fmt(sec){ sec=Math.max(0,sec||0); let m=Math.floor(sec/60), s=Math.floor(sec%60); return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function showNotice(msg){ $("notice").textContent=msg; $("notice").style.display="block"; }
function hideNotice(){ $("notice").style.display="none"; }

async function getJSON(u){
  const r=await fetch(u,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
}

async function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  masterGain.gain.value = Number($("master").value);
  masterGain.connect(analyser).connect(audioCtx.destination);
}

async function loadSequences(){
  try{
    const data=await getJSON(BASE_URL+SEQUENCE_INDEX);
    const list=$("sequenceList"); list.innerHTML="";
    const seqs=data.sequences || [];
    if(!seqs.length){list.innerHTML='<div class="empty">No hay secuencias en el índice.</div>';return;}
    seqs.forEach(seq=>{
      const b=document.createElement("button"); b.className="sequence";
      b.innerHTML=`<div class="name">♫ &nbsp;${esc(seq.name)}</div><div class="meta">${esc(seq.folder)}</div>`;
      b.onclick=()=>loadSequence(seq,b);
      list.appendChild(b);
    });
    $("status").textContent=seqs.length+" secuencia"+(seqs.length===1?"":"s")+" disponible"+(seqs.length===1?"":"s");
  }catch(e){
    $("sequenceList").innerHTML='<div class="empty">No se pudo leer index-secuencia.json.</div>';
    showNotice("No se pudo consultar Backblaze. Si el archivo existe, revisa que el bucket permita CORS para esta página.");
    $("status").textContent="Error de conexión";
    console.error(e);
  }
}

function parseTrack(file){
  const base=file.split("/").pop();
  const m=base.match(/^pista-(\d+)-(.+?)\.(mp3|wav|ogg|m4a)$/i);
  if(!m) return {number:9999,name:base,file};
  return {number:Number(m[1]),name:m[2],file};
}

async function loadSequence(seq,button){
  stopAll();
  document.querySelectorAll(".sequence").forEach(x=>x.classList.remove("selected"));
  button.classList.add("selected");
  $("sequenceTitle").textContent="Secuencia: "+seq.name;
  $("channels").innerHTML='<div class="empty">Cargando pistas…</div>';
  hideNotice();
  try{
    const data=await getJSON(url(seq.folder,"index-pista.json"));
    const files=(data.tracks||[]).map(parseTrack).sort((a,b)=>a.number-b.number);
    if(!files.length) throw new Error("El índice de pistas está vacío.");
    tracks=files.map(t=>({...t,buffer:null,source:null,gain:null,panner:null,analyser:null,muted:false,solo:false,volume:1,pan:0}));
    $("trackCount").textContent=tracks.length+" pistas";
    renderChannels(seq.folder);
    await initAudio();
    $("status").textContent="Cargando "+tracks.length+" pistas…";
    await Promise.all(tracks.map(async t=>{
      const r=await fetch(url(seq.folder,t.file),{cache:"force-cache"});
      if(!r.ok) throw new Error("No se pudo cargar "+t.file+" (HTTP "+r.status+")");
      t.buffer=await audioCtx.decodeAudioData(await r.arrayBuffer());
    }));
    duration=Math.max(...tracks.map(t=>t.buffer.duration));
    $("seek").max=duration; $("seek").value=0;
    $("time").textContent=fmt(0)+" / "+fmt(duration);
    $("status").textContent="Lista: "+seq.name;
    updateMeters();
  }catch(e){
    console.error(e);
    $("channels").innerHTML='<div class="empty">No fue posible cargar la secuencia.</div>';
    showNotice("Error cargando la secuencia: "+e.message);
    $("status").textContent="Error al cargar";
  }
}

function renderChannels(folder){
  $("channels").innerHTML="";
  tracks.forEach((t,i)=>{
    const ch=document.createElement("div"); ch.className="channel"; ch.dataset.i=i;
    ch.innerHTML=`
      <div class="chNo">${t.number}</div>
      <div class="chName" title="${esc(t.name)}">${esc(t.name)}</div>
      <div class="panLabel">PAN</div>
      <input class="pan" type="range" min="-1" max="1" step="0.01" value="0" aria-label="Paneo">
      <div class="soloMute"><button class="sm soloBtn">S</button><button class="sm muteBtn">M</button></div>
      <div class="meterFader"><div class="meter">${'<i class="seg"></i>'.repeat(30)}</div><div class="faderBox"><input class="fader" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volumen"></div></div>
      <div class="db">0.0 dB</div>
      <button class="sm muteBottom">MUTE</button>`;
    const pan=ch.querySelector(".pan"), fader=ch.querySelector(".fader"), solo=ch.querySelector(".soloBtn"), mute=ch.querySelector(".muteBtn"), mb=ch.querySelector(".muteBottom");
    pan.oninput=e=>{t.pan=Number(e.target.value); if(t.panner)t.panner.pan.value=t.pan};
    fader.oninput=e=>{t.volume=Number(e.target.value); updateTrackGain(t); ch.querySelector(".db").textContent=(t.volume===0?"-∞":(20*Math.log10(t.volume)).toFixed(1))+" dB"};
    const toggleMute=()=>{t.muted=!t.muted; mute.classList.toggle("muteOn",t.muted); mb.classList.toggle("muteOn",t.muted); updateTrackGain(t)};
    mute.onclick=toggleMute; mb.onclick=toggleMute;
    solo.onclick=()=>{t.solo=!t.solo;solo.classList.toggle("soloOn",t.solo);updateAllGains()};
    $("channels").appendChild(ch);
  });
}
function updateTrackGain(t){
  if(!t.gain)return;
  const anySolo=tracks.some(x=>x.solo);
  t.gain.gain.value=(t.muted || (anySolo && !t.solo))?0:t.volume;
}
function updateAllGains(){tracks.forEach(updateTrackGain)}

function makeSources(offset){
  tracks.forEach(t=>{
    if(!t.buffer)return;
    const src=audioCtx.createBufferSource(); src.buffer=t.buffer;
    t.gain=audioCtx.createGain(); t.panner=audioCtx.createStereoPanner(); t.analyser=audioCtx.createAnalyser(); t.analyser.fftSize=64;
    src.connect(t.gain).connect(t.panner).connect(t.analyser).connect(masterGain);
    t.panner.pan.value=t.pan; t.gain.gain.value=t.volume;
    src.start(0,Math.min(offset,t.buffer.duration));
    t.source=src;
    src.onended=()=>{ if(isPlaying && performance.now()/1000-startedAt>=duration-0.05){ if(loop){playFrom(0)} else {isPlaying=false;pausedAt=duration;cancelAnimationFrame(raf);updateUI();}}};
  });
  updateAllGains();
}
function disconnectSources(){tracks.forEach(t=>{try{t.source?.stop()}catch{} try{t.source?.disconnect()}catch{} t.source=null;t.gain=null;t.panner=null;t.analyser=null})}
function currentTime(){return isPlaying ? Math.min(duration,performance.now()/1000-startedAt) : pausedAt}
async function playFrom(offset){
  if(!tracks.length || !tracks.some(t=>t.buffer))return;
  await initAudio(); await audioCtx.resume();
  disconnectSources(); offset=Math.max(0,Math.min(duration,offset));
  pausedAt=offset; startedAt=performance.now()/1000-offset; isPlaying=true;
  makeSources(offset); updateUI(); tick();
}
function pause(){if(!isPlaying)return;pausedAt=currentTime();isPlaying=false;disconnectSources();cancelAnimationFrame(raf);updateUI()}
function stopAll(){isPlaying=false;pausedAt=0;disconnectSources();cancelAnimationFrame(raf);$("seek").value=0;$("time").textContent="00:00 / "+fmt(duration);updateUI()}
function updateUI(){$("playBtn").classList.toggle("active",isPlaying);$("seek").value=currentTime();$("time").textContent=fmt(currentTime())+" / "+fmt(duration)}
function tick(){updateUI();if(isPlaying)raf=requestAnimationFrame(tick)}
function updateMeters(){
  if(!analyser)return;
  const data=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const level=Math.max(...data)/255;
  document.querySelectorAll(".channel").forEach((ch,i)=>{
    const local=tracks[i].analyser;
    if(!local)return;
    const d=new Uint8Array(local.frequencyBinCount);local.getByteFrequencyData(d);
    const lv=Math.max(...d)/255;
    ch.querySelectorAll(".seg").forEach((s,n)=>{s.classList.toggle("on",n<lv*30);s.classList.toggle("hot",n>24&&n<lv*30);s.classList.toggle("clip",n>28&&n<lv*30)});
  });
  requestAnimationFrame(updateMeters);
}
$("playBtn").onclick=()=>isPlaying?pause():playFrom(currentTime());
$("pauseBtn").onclick=pause;
$("stopBtn").onclick=stopAll;
$("seek").oninput=e=>{const v=Number(e.target.value);pausedAt=v;if(isPlaying)playFrom(v);else updateUI()};
$("master").oninput=e=>{if(masterGain)masterGain.gain.value=Number(e.target.value)};
$("loopBtn").onclick=()=>{loop=!loop;$("loopBtn").classList.toggle("active",loop)};
$("rewindBtn").onclick=()=>playFrom(Math.max(0,currentTime()-10));
$("forwardBtn").onclick=()=>playFrom(Math.min(duration,currentTime()+10));
window.addEventListener("beforeunload",()=>disconnectSources());
loadSequences();
</script>
</body>
</html>
